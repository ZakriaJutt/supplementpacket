[mypy]
python_version = 3.12
mypy_path = apps/api/src:apps/worker/src:packages/core/src:packages/db/src:packages/files/src:packages/parsers/src:packages/obs/src
explicit_package_bases = True
namespace_packages = True
strict = True
warn_unused_ignores = False
plugins = pydantic.mypy

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True
