line-length = 140
target-version = "py312"
src = ["apps/api/src", "apps/worker/src", "packages/core/src", "packages/db/src", "packages/files/src", "packages/parsers/src", "packages/obs/src", "scripts", "tests"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "S608", "B008", "RUF012", "S105", "S106", "S311", "UP047"]

[lint.per-file-ignores]
"tests/**" = ["S", "BLE", "E501"]
"packages/db/src/sp_db/migrations/versions/**" = ["E501"]
